<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Digital Vinyl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <main class="stage">
        <!-- Square frame for a round 1080x1080 display; everything inside scales with it -->
        <div class="player" id="player" data-view="idle">

            <!-- The record: drag to seek, tap to switch between cover and lyrics -->
            <div class="disc" id="disc">
                <div class="album-art" id="albumArt"></div>
                <div class="grooves"></div>
                <div class="sheen"></div>
                <div class="spindle"></div>
                <div class="art-scrim"></div>
                <div class="lyrics-backdrop"></div>

                <svg class="progress-ring" viewBox="0 0 1080 1080" aria-hidden="true">
                    <circle class="progress-track" cx="540" cy="540" r="532" />
                    <circle class="progress-fill" id="progressFill" cx="540" cy="540" r="532" transform="rotate(-90 540 540)" />
                    <circle class="progress-knob" id="progressKnob" cx="540" cy="8" r="16" />
                </svg>

                <section class="idle-view">
                    <div class="idle-clock" id="idleClock" aria-hidden="true">
                        <div class="idle-time" id="idleTime"></div>
                        <div class="idle-date" id="idleDate"></div>
                    </div>
                    <svg class="idle-icon" viewBox="0 0 48 48" aria-hidden="true">
                        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2.5" />
                        <circle cx="24" cy="24" r="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.5" />
                        <circle cx="24" cy="24" r="4" fill="currentColor" />
                    </svg>
                    <h1>Nothing playing</h1>
                    <p>Play something on Spotify and choose <strong>Digital Vinyl</strong> as your device.</p>
                </section>

                <section class="now-playing">
                    <div class="track-title" id="trackTitle"></div>
                    <div class="track-artist" id="trackArtist"></div>
                </section>

                <section class="lyrics-view" id="lyricsView">
                    <div class="lyrics-lines" id="lyricsLines"></div>
                </section>

                <div class="seek-readout" aria-hidden="true">
                    <span class="seek-time" id="seekTime">0:00</span>
                    <span class="seek-total" id="seekTotal"></span>
                </div>
            </div>

            <!-- Library: search, filters, and your playlists/albums/recents -->
            <section class="library" id="library" aria-label="Your Library" aria-hidden="true">
                <div class="library-inner">
                    <h2 class="library-title" id="libraryTitle">Your Library</h2>
                    <label class="search-field">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2" /><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
                        <input id="searchInput" type="search" placeholder="Search songs or artists" autocomplete="off" spellcheck="false" aria-label="Search">
                    </label>
                    <div class="chips" role="tablist">
                        <button class="chip" type="button" role="tab" data-tab="playlists">Playlists</button>
                        <button class="chip" type="button" role="tab" data-tab="albums">Albums</button>
                        <button class="chip" type="button" role="tab" data-tab="recent">Recent</button>
                        <button class="chip" type="button" role="tab" data-tab="queue">Queue</button>
                        <button class="chip chip-icon" type="button" role="tab" data-tab="settings" aria-label="Settings">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.5h-4l-.3 2.5a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" /><circle cx="13" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8" transform="translate(-1 0)" /></svg>
                        </button>
                    </div>
                    <div class="library-list" id="libraryList"></div>
                </div>
            </section>

            <button class="top-btn" id="libraryBtn" type="button" aria-label="Open library">
                <svg class="icon-library" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3.5v17M9 3.5v17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /><path d="m13.5 4.2 5.8 15.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
                <svg class="icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </button>

            <div class="transport">
                <button class="icon-btn mode-btn" id="shuffleBtn" type="button" aria-label="Shuffle" aria-pressed="false">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" /></svg>
                </button>
                <button class="icon-btn" id="prevBtn" type="button" aria-label="Previous">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="2.6" height="16" rx="1" /><path d="M20 4.9v14.2a.8.8 0 0 1-1.2.7L8.6 12.7a.8.8 0 0 1 0-1.4l10.2-7.1a.8.8 0 0 1 1.2.7Z" /></svg>
                </button>
                <button class="play-btn" id="playPauseBtn" type="button" aria-label="Play">
                    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.6v14.8a.9.9 0 0 0 1.4.8l11.6-7.4a.9.9 0 0 0 0-1.6L8.4 3.8A.9.9 0 0 0 7 4.6Z" /></svg>
                    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.2" /><rect x="14" y="4" width="4.5" height="16" rx="1.2" /></svg>
                </button>
                <button class="icon-btn" id="nextBtn" type="button" aria-label="Next">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="17.4" y="4" width="2.6" height="16" rx="1" /><path d="M4 4.9v14.2a.8.8 0 0 0 1.2.7l10.2-7.1a.8.8 0 0 0 0-1.4L5.2 4.2A.8.8 0 0 0 4 4.9Z" /></svg>
                </button>
                <button class="icon-btn mode-btn" id="repeatBtn" type="button" aria-label="Repeat: off" data-repeat="off">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3" /></svg>
                    <span class="repeat-one" aria-hidden="true">1</span>
                </button>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
    </main>

    <!-- Spotify Web Playback SDK: makes this page a Spotify Connect device -->
    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
